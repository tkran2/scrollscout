name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[figures,test]"
      - name: Unit tests (offline)
        run: python -m pytest -q tests
      - name: Command line smoke test
        run: scrollscout --help && scrollscout check-segment --help && scrollscout near --help
